<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ManhwCard — Каталог Карт</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #090910;
            --surface: #111118;
            --surface2: #18181f;
            --border: #2a2a38;
            --accent: #7c5cfc;
            --accent2: #a855f7;
            --text: #f0f0ff;
            --muted: #888899;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 0 0 30px;
        }

        /* ── ШАПКА ── */
        .site-header {
            background: linear-gradient(135deg, #0d0d18 0%, #1a0a2e 50%, #0d0d18 100%);
            padding: 22px 16px 16px;
            text-align: center;
            border-bottom: 1px solid #2a1a4a;
            position: relative;
            overflow: hidden;
        }
        .site-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,92,252,0.18) 0%, transparent 70%);
            pointer-events: none;
        }
        .logo-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #a78bfa, #ec4899, #a78bfa);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
            position: relative;
            z-index: 1;
        }
        .logo-sub {
            font-size: 11px;
            letter-spacing: 5px;
            color: var(--muted);
            text-transform: uppercase;
            margin-top: 2px;
            position: relative;
            z-index: 1;
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* ── ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ ── */
        .profile-box {
            display: none;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
        }
        .profile-stat {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--surface);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .owned-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #10b981;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 6px;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* ── КОНТРОЛЫ ── */
        .header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px 14px 0;
        }
        .controls-row { display: flex; gap: 10px; }
        .controls-row > * { flex: 1; }

        input, select {
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            outline: none;
            font-size: 13px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
        }
        input::placeholder { color: var(--muted); }

        /* ── СЧЁТЧИК ── */
        .cards-count {
            padding: 8px 14px 0;
            font-size: 12px;
            color: var(--muted);
        }
        .cards-count b { color: var(--accent2); }

        /* ── СЕТКА ── */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 14px;
            padding: 14px;
        }

        /* ── КАРТОЧКА ── */
        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 10px;
            text-align: center;
            border: 1.5px solid var(--border);
            box-shadow: 0 4px 18px rgba(0,0,0,0.4);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            position: relative;
            overflow: hidden;
        }
        .card:active {
            transform: scale(0.96);
        }

        /* Подсветка рамки по редкости (Без эмодзи) */
        .card[data-rarity="Обычная"]       { border-color: #555566; }
        .card[data-rarity="Редкая"]         { border-color: #3b82f6; box-shadow: 0 4px 20px rgba(59,130,246,0.25); }
        .card[data-rarity="Эпическая"]      { border-color: #a855f7; box-shadow: 0 4px 20px rgba(168,85,247,0.3); }
        .card[data-rarity="Легендарная"]    { border-color: #f59e0b; box-shadow: 0 4px 24px rgba(245,158,11,0.35); }
        .card[data-rarity="Мифическая"]     { border-color: #ef4444; box-shadow: 0 4px 24px rgba(239,68,68,0.35); }
        .card[data-rarity="Божественная"]   {
            border-color: #222;
            box-shadow: 0 0 0 1px #444, 0 6px 30px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.03);
            background: linear-gradient(145deg, #0d0d0d, #1a1a1a, #0d0d0d);
        }
        .card[data-rarity="Божественная"]::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 17px;
            background: linear-gradient(135deg, #333, #111, #444, #111, #333);
            background-size: 300% 300%;
            animation: divineShimmer 4s linear infinite;
            z-index: 0;
            opacity: 0.6;
        }
        .card[data-rarity="Божественная"] > * { position: relative; z-index: 1; }

        .card img {
            width: 100%;
            height: 175px;
            object-fit: cover;
            border-radius: 10px;
            background: var(--surface2);
        }
        .card h3 {
            font-size: 14px;
            font-weight: 600;
            margin: 10px 0 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── БЕЙДЖ РЕДКОСТИ (Без эмодзи) ── */
        .rarity {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 9px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .rarity-Обычная    { background: #2a2a35; color: #aaa; }
        .rarity-Редкая      { background: rgba(59,130,246,0.18); color: #60a5fa; border: 1px solid rgba(59,130,246,0.35); }
        .rarity-Эпическая   { background: rgba(168,85,247,0.18); color: #c084fc; border: 1px solid rgba(168,85,247,0.35); }
        .rarity-Легендарная { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
        .rarity-Мифическая  { background: rgba(239,68,68,0.18); color: #f87171; border: 1px solid rgba(239,68,68,0.35); }
        .rarity-Божественная {
            background: linear-gradient(90deg, #111, #222, #111);
            color: #ccc;
            border: 1px solid #444;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
            letter-spacing: 1px;
        }

        /* ── СТАТЫ ── */
        .stats {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid var(--border);
            padding-top: 8px;
        }
        .stats span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .stats b { color: var(--text); font-size: 13px; font-weight: 600; }

        /* ── ПУСТО ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: var(--muted);
        }
        .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
        .empty-state p { font-size: 14px; }
    </style>
</head>
<body>

    <div class="site-header">
        <div class="logo-text">ManhwCard</div>
        <div class="logo-sub">Card Catalogue</div>
    </div>

    <div class="profile-box" id="profileBox">
        <div class="profile-stat">💎 <span id="valDiamond">0</span></div>
        <div class="profile-stat">💴 <span id="valKrw">0</span></div>
        <div class="profile-stat">🪙 <span id="valBc">0</span></div>
    </div>

    <div class="header">
        <input type="text" id="searchInput" placeholder="🔍  Поиск по имени..." oninput="updateCards()">
        <div class="controls-row">
            <select id="rarityFilter" onchange="updateCards()">
                <option value="all">Все редкости</option>
                <option value="Обычная">⚪ Обычная</option>
                <option value="Редкая">🟡 Редкая</option>
                <option value="Эпическая">🟢 Эпическая</option>
                <option value="Легендарная">🔵 Легендарная</option>
                <option value="Мифическая">🔴 Мифическая</option>
                <option value="Божественная">⚫ Божественная</option>
            </select>
            <select id="sortSelect" onchange="updateCards()">
                <option value="default">Сортировка</option>
                <option value="strength">По Силе 💪</option>
                <option value="speed">По Скорости ⚡️</option>
                <option value="intellect">По Интеллекту 🧠</option>
            </select>
        </div>
    </div>

    <div class="cards-count" id="cardsCount"></div>
    <div class="cards-grid" id="cardsContainer"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let userId = tg.initDataUnsafe?.user?.id;
        
        let allCards = [];
        let userOwnedCards = [];

        async function fetchProfile() {
            if (!userId) return; 
            try {
                let res = await fetch(`https://manhwcard.bothost.tech/api/profile/${userId}`);
                
                if (res.ok) {
                    let data = await res.json();
                    
                    document.getElementById('profileBox').style.display = 'flex';
                    document.getElementById('valDiamond').innerText = data.diamond;
                    document.getElementById('valKrw').innerText = data.krw;
                    document.getElementById('valBc').innerText = data.battlecoin;

                    userOwnedCards = data.owned_cards;
                }
                updateCards();
            } catch (e) {
                console.error("Ошибка загрузки профиля:", e);
            }
        }

        fetch('cards.json')
            .then(r => r.json())
            .then(data => {
                allCards = data;
                updateCards();
                fetchProfile(); 
            });

        function renderCards(cards) {
            const container = document.getElementById('cardsContainer');
            const counter   = document.getElementById('cardsCount');
            container.innerHTML = '';

            counter.innerHTML = cards.length
                ? `Показано карт: <b>${cards.length}</b>`
                : '';

            if (!cards.length) {
                container.innerHTML = `<div class="empty-state"><div class="icon">🃏</div><p>Ничего не найдено</p></div>`;
                return;
            }

            cards.forEach(card => {
                // Отрезаем всё после первого пробела. "Обычная ⚪️" -> "Обычная"
                const cleanRarity = card.rarity.split(' ')[0];
                
                const rarityClass = 'rarity-' + cleanRarity;
                const isOwned = userOwnedCards.includes(card.id);
                const ownedHtml = isOwned ? `<div class="owned-badge">В наличии ✓</div>` : '';

                const div = document.createElement('div');
                div.className = 'card';
                // В data-rarity тоже пишем чистую редкость
                div.dataset.rarity = cleanRarity;
                
                if (!isOwned && userOwnedCards.length > 0) {
                    div.style.opacity = "0.6";
                    div.style.filter = "grayscale(40%)"; 
                }

                div.innerHTML = `
                    ${ownedHtml}
                    <img src="images/${card.file}" alt="${card.name}" onerror="this.src='https://placehold.co/150x200/111118/555577?text=No+Image'">
                    <h3>${card.name}</h3>
                    <div class="rarity ${rarityClass}">${card.rarity}</div>
                    <div class="stats">
                        <span>💪 <b>${card.strength}</b></span>
                        <span>⚡️ <b>${card.speed}</b></span>
                        <span>🧠 <b>${card.intellect}</b></span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updateCards() {
            const search   = document.getElementById('searchInput').value.toLowerCase();
            const rarity   = document.getElementById('rarityFilter').value;
            const sortType = document.getElementById('sortSelect').value;

            let filtered = allCards.filter(card => {
                const cleanRarity = card.rarity.split(' ')[0];
                const matchName   = card.name.toLowerCase().includes(search);
                // Фильтруем по чистой редкости
                const matchRarity = rarity === 'all' || cleanRarity === rarity;
                return matchName && matchRarity;
            });

            if (sortType === 'strength')  filtered.sort((a, b) => b.strength  - a.strength);
            if (sortType === 'speed')     filtered.sort((a, b) => b.speed     - a.speed);
            if (sortType === 'intellect') filtered.sort((a, b) => b.intellect - a.intellect);

            renderCards(filtered);
        }
    </script>
</body>
</html>
