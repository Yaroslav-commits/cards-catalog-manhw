<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ManhwCard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <header class="header">
        <button id="back-btn" style="display:none;" onclick="nav('home')">⬅️</button>
        <div class="user-profile" id="user-profile-header">
            <div class="avatar-circle"></div>
            <span id="user-name">Игрок</span>
        </div>
        <div class="balance">
            💎 <span id="bal-diamonds">0</span>
        </div>
    </header>

    <main id="view-home" class="view active">
        <div class="menu-grid">
            <div class="menu-card" onclick="nav('profile')">
                <div class="menu-icon">👤</div>
                <h3>Профиль</h3>
            </div>
            <div class="menu-card" onclick="nav('collection')">
                <div class="menu-icon">📚</div>
                <h3>Коллекция</h3>
            </div>
            <div class="menu-card" onclick="nav('battlepass')">
                <div class="menu-icon">🎟</div>
                <h3>Battle Pass</h3>
            </div>
            <div class="menu-card" onclick="nav('admin')">
                <div class="menu-icon">⚙️</div>
                <h3>Админ-панель</h3>
            </div>
        </div>
    </main>

    <main id="view-profile" class="view">
        <div class="profile-header">
            <h2>Ваш профиль</h2>
        </div>
        <div class="showcase">
            <h3>Витрина любимых карт</h3>
            <div class="cards-grid" id="favorite-cards">
                <!-- Заполняется JS -->
            </div>
        </div>
        <div class="profile-actions">
            <button class="btn disabled" onclick="alert('В разработке')">Банда</button>
            <button class="btn disabled" onclick="alert('В разработке')">Магазин</button>
            <button class="btn" onclick="alert('Достижения:\nСбор вселенной 0/1 (Награда 50 💎)')">🏆 Достижения</button>
        </div>
    </main>

    <main id="view-collection" class="view">
        <h2>Manhwa Titles</h2>
        <div id="universes-list" class="list-container">
            <!-- JS -->
        </div>
    </main>
    
    <main id="view-cards" class="view">
        <h2 id="current-universe-title">Карты</h2>
        <div id="cards-grid" class="cards-grid">
            <!-- JS -->
        </div>
    </main>
    
    <main id="view-battlepass" class="view">
        <h2>Battle Pass</h2>
        <div class="bp-container">
            <div class="bp-col free">
                <h3 class="bp-title">Free Pass</h3>
                <div class="bp-days" id="free-days"></div>
            </div>
            <div class="bp-col pro">
                <h3 class="bp-title">Pro Pass <br><span class="price">449 ⭐️</span></h3>
                <button class="btn btn-buy" onclick="buyPass()">Купить Pro</button>
                <div class="bp-days" id="pro-days"></div>
            </div>
        </div>
    </main>

    <main id="view-admin" class="view">
        <h2>Управление</h2>
        <div class="admin-actions">
            <button class="btn btn-admin" onclick="alert('Форма добавления тайтла')">+ Добавить Тайтл</button>
            <button class="btn btn-admin" onclick="alert('Форма добавления карты')">+ Добавить Карту</button>
        </div>
        <h3 style="margin-top:20px">Все карты</h3>
        <select class="admin-filter" id="admin-filter" onchange="renderAdminCards()">
            <option value="all">Все редкости</option>
            <option value="Божественная ⚫️">Божественная</option>
            <option value="Мифическая 🔴">Мифическая</option>
            <option value="Легендарная 🔵">Легендарная</option>
            <option value="Эпическая 🟢">Эпическая</option>
            <option value="Редкая 🟡">Редкая</option>
            <option value="Обычная ⚪️">Обычная</option>
        </select>
        <div id="admin-cards" class="list-container" style="margin-top:10px"></div>
    </main>

    <!-- Modal -->
    <div id="card-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-rarity-border" class="modal-border">
                <img id="modal-img" src="" alt="card">
            </div>
            <h2 id="modal-name"></h2>
            <p class="modal-rarity" id="modal-rarity"></p>
            <div class="stats">
                <div>Скорость: <span id="m-spd"></span></div>
                <div>Сила: <span id="m-str"></span></div>
                <div>Интеллект: <span id="m-int"></span></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
